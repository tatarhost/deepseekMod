name: dpLab Android Release

on:
  push:
    branches: [main]
    paths:
      - "dpLab/**"
      - ".github/workflows/dplab-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"
      - name: Install Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build dpLab APK
        run: gradle --no-daemon -PbuildNumber=${{ github.run_number }} :app:assembleDebug
        working-directory: dpLab
      - name: Prepare APK
        run: |
          cp dpLab/app/build/outputs/apk/debug/app-debug.apk "dpLab-1.0.$GITHUB_RUN_NUMBER.apk"
          sha256sum "dpLab-1.0.$GITHUB_RUN_NUMBER.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpLab-1.0.${{ github.run_number }}
          path: dpLab-1.0.${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dplab-v1.0.${{ github.run_number }}
          name: dpLab 1.0.${{ github.run_number }}
          generate_release_notes: true
          files: dpLab-1.0.${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
